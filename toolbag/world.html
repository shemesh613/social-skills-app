<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<title>🎒 תיק הכלים — פרק 1: הפנס הפנימי (עולם)</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Heebo',sans-serif;background:#0d1330;color:#fff;user-select:none;touch-action:none}
#c3d{position:fixed;inset:0;display:block}

/* ---------- HUD ---------- */
#quest{position:fixed;top:12px;left:50%;transform:translateX(-50%);background:rgba(10,14,40,.78);border:1.5px solid rgba(255,213,74,.6);border-radius:30px;padding:8px 20px;font-size:15.5px;font-weight:800;color:#ffd54a;z-index:10;white-space:nowrap;box-shadow:0 6px 20px rgba(0,0,0,.4)}
#act{position:fixed;bottom:110px;left:50%;transform:translateX(-50%);display:none;z-index:10;border:none;border-radius:18px;padding:14px 26px;font-family:'Heebo';font-size:18px;font-weight:800;background:linear-gradient(180deg,#ffd54a,#f5a623);color:#4a2c00;box-shadow:0 6px 0 #b57712,0 12px 30px rgba(0,0,0,.5);cursor:pointer;animation:bob 1.2s ease-in-out infinite}
@keyframes bob{0%,100%{transform:translate(-50%,0)}50%{transform:translate(-50%,-7px)}}
#joy{position:fixed;bottom:26px;right:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.25);z-index:10;touch-action:none}
#knob{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,213,74,.85);transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.keysHint{position:fixed;bottom:34px;left:26px;font-size:13px;opacity:.6;z-index:10}
#sndBtn{position:fixed;top:10px;left:12px;width:52px;height:52px;border-radius:50%;background:rgba(10,14,40,.78);border:1.5px solid rgba(255,213,74,.6);font-size:26px;line-height:1;cursor:pointer;z-index:80;box-shadow:0 6px 20px rgba(0,0,0,.4)}
/* ---------- tool-progress strip — continuity with the practice modules (e.g. flower.html) ---------- */
#toolNav{position:fixed;top:56px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:15;background:rgba(10,14,40,.6);border-radius:16px;padding:5px 8px}
#toolNav .tn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.35;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
#toolNav .tn.earned{opacity:.85;cursor:pointer}
#toolNav .tn.earned:active{transform:scale(.9)}

/* ---------- overlays ---------- */
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;padding:20px;z-index:20;overflow-y:auto}
.ov.on{display:flex}
.ov.dimbg{background:rgba(6,8,28,.72);backdrop-filter:blur(2px)}
h1{font-family:'Frank Ruhl Libre',serif;font-size:clamp(28px,7vw,48px);color:#ffd54a;text-shadow:0 4px 24px rgba(255,213,74,.35)}
h2{font-family:'Frank Ruhl Libre',serif;font-size:clamp(20px,4.5vw,28px);color:#ffd54a;margin-bottom:8px;text-align:center}
.btn{display:block;width:100%;max-width:420px;margin:8px auto;padding:15px 22px;border:none;border-radius:16px;font-family:'Heebo';font-size:17.5px;font-weight:800;cursor:pointer;background:linear-gradient(180deg,#ffd54a,#f5a623);color:#4a2c00;box-shadow:0 6px 0 #b57712,0 10px 24px rgba(0,0,0,.35);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b57712}
.btn.sec{background:linear-gradient(180deg,#3c477f,#2a3260);color:#dfe6ff;box-shadow:0 6px 0 #1a2040}
.btn.calm{background:linear-gradient(180deg,#7dffa8,#25c05f);color:#053514;box-shadow:0 6px 0 #128040}
.chapter{background:rgba(255,213,74,.14);border:1.5px solid rgba(255,213,74,.55);border-radius:30px;padding:7px 22px;font-size:16px;font-weight:800;color:#ffd54a;margin:12px 0 20px}
.charRow{display:flex;gap:12px;flex-wrap:wrap;justify-content:center;max-width:560px}
.charCard{background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);border-radius:18px;padding:16px 18px;font-family:'Heebo';font-size:16.5px;font-weight:800;color:#fff;cursor:pointer;min-width:96px;transition:all .15s}
.charCard:hover{border-color:#ffd54a;background:rgba(255,213,74,.13);transform:translateY(-3px)}
.charCard img{display:block;width:92px;height:112px;margin:0 auto 6px;pointer-events:none;filter:drop-shadow(0 6px 10px rgba(0,0,0,.4))}
.tiny{font-size:13px;opacity:.65;margin-top:12px;text-align:center}

/* dialogue (bottom, over the 3D scene) */
#dlg{position:fixed;left:0;right:0;bottom:0;padding:14px;z-index:22;display:none}
#dlg.on{display:block}
.bubble{position:relative;max-width:620px;margin:0 auto;background:#fffef2;color:#3a2c10;border-radius:20px;padding:16px 20px 14px;font-size:clamp(16px,2.4vh,19px);line-height:1.65;font-weight:600;min-height:88px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.who{position:absolute;top:-15px;right:14px;background:#ffd54a;color:#4a2c00;font-size:13.5px;font-weight:800;border-radius:20px;padding:2px 12px}
.next{text-align:center;font-size:13.5px;color:#a15c00;opacity:.8;margin-top:6px;animation:tw 1.6s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}
#chDlg{max-width:620px;margin:10px auto 0}
.choice{display:block;width:100%;margin:8px 0;padding:13px 16px;border:2px solid rgba(255,255,255,.25);border-radius:16px;background:rgba(12,16,44,.88);color:#fff;font-family:'Heebo';font-size:16px;font-weight:700;cursor:pointer;text-align:right;line-height:1.5}
.choice:hover{border-color:#ffd54a}
.reflect{max-width:620px;margin:10px auto 0;background:rgba(12,22,50,.92);border:1.5px dashed rgba(143,211,255,.55);border-radius:16px;padding:12px 16px;font-size:15px;line-height:1.7;color:#dff0ff}

/* feelings flow */
.bigheart{font-size:clamp(84px,20vw,130px);animation:beat 1.2s infinite;filter:drop-shadow(0 0 34px rgba(255,90,120,.45));transition:filter .9s}
@keyframes beat{0%,100%{transform:scale(1)}50%{transform:scale(1.12)}}
.bigheart.dim{filter:brightness(.1)}
.bigheart.calm{animation:calmG 2.4s ease-in-out infinite;filter:drop-shadow(0 0 44px rgba(255,213,110,.8))}
@keyframes calmG{0%,100%{transform:scale(1)}50%{transform:scale(1.06)}}
#torchIn{display:none;font-size:44px;transform:rotate(-140deg);animation:torchDrop .9s cubic-bezier(.3,1.4,.4,1);filter:drop-shadow(0 0 18px rgba(255,235,150,.9));margin-bottom:-12px}
@keyframes torchDrop{from{opacity:0;transform:rotate(-140deg) translateY(-40px) scale(.4)}to{opacity:1;transform:rotate(-140deg) translateY(0) scale(1)}}
.feelRow{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin:14px 0}
.feel{background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.3);border-radius:18px;padding:13px 18px;font-size:16.5px;font-weight:800;color:#fff;cursor:pointer;text-align:center;min-width:100px}
.feel:hover{border-color:#ffd54a}
.feel span{display:block;font-size:32px;margin-bottom:3px}
.ctxTxt{font-size:15.5px;line-height:1.7;font-weight:600;text-align:center;max-width:520px}

/* badge */
.slots{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;margin:16px 0;max-width:520px}
.slot{width:58px;height:58px;border-radius:16px;background:rgba(255,255,255,.07);border:2px dashed rgba(255,255,255,.25);display:flex;align-items:center;justify-content:center;font-size:28px;opacity:.55}
.slot.earned{background:rgba(255,213,74,.16);border:2px solid #ffd54a;opacity:1;animation:pop .6s cubic-bezier(.2,1.6,.4,1);box-shadow:0 0 22px rgba(255,213,74,.5)}
@keyframes pop{0%{transform:scale(0)}100%{transform:scale(1)}}

/* family card */
.famCard{width:100%;max-width:560px;background:#fffef2;color:#3a2c10;border-radius:22px;padding:22px;text-align:right;box-shadow:0 16px 44px rgba(0,0,0,.5)}
.famCard h3{font-family:'Frank Ruhl Libre',serif;color:#a15c00;font-size:20px;margin-bottom:8px;text-align:center}
.famCard li{font-size:15px;line-height:1.8;margin-bottom:7px}
.famCard ul{padding-right:20px}
.mission{background:linear-gradient(135deg,#fff3c9,#ffe4a1);border:2px solid #f5a623;border-radius:16px;padding:12px 16px;margin-top:12px;font-size:15px;line-height:1.7;font-weight:700}

canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}
#flyTool{position:fixed;font-size:66px;z-index:50;pointer-events:none;display:none}
.stars{position:fixed;inset:0;pointer-events:none;z-index:0}
.stars i{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff;opacity:.5;animation:tw 3s infinite}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<canvas id="c3d"></canvas>
<canvas id="confetti"></canvas>
<div id="flyTool">🔦</div>

<div id="quest" style="display:none"></div>
<div id="toolNav"></div>
<button id="act"></button>
<div id="joy" style="display:none"><div id="knob"></div></div>
<div class="keysHint" id="keysHint" style="display:none">🎮 חצים / WASD לתנועה</div>
<button id="sndBtn" aria-label="הפעלה או כיבוי של הצליל">🔊</button>

<!-- title -->
<div id="fade" style="position:fixed;inset:0;background:#000;opacity:0;transition:opacity .8s;pointer-events:none;z-index:70"></div>
<div class="ov on dimbg" id="ov-title">
  <div class="stars" id="stars"></div>
  <div style="font-size:clamp(70px,17vw,120px);filter:drop-shadow(0 14px 30px rgba(0,0,0,.5))">🎒</div>
  <h1>תיק הכלים</h1>
  <div class="chapter">פרק 1 · הפנס הפנימי 🔦</div>
  <button class="btn" id="startBtn" disabled onclick="ovShow('ov-char')">⏳ טוען דמויות 0/6</button>
  <button class="btn sec" style="max-width:260px;font-size:15px;padding:11px 18px" onclick="location.href='flower.html'">🌸 תרגול הפרח</button>
  <div class="tiny">מסע של 7 כלים לחיים · הזיזו את הדמות, גשו לדמויות — והחיים יקרו</div>
</div>

<!-- character select -->
<div class="ov dimbg" id="ov-char">
  <h1 style="font-size:clamp(22px,5vw,34px)">🧒 מי אתם במסע?</h1>
  <div class="ctxTxt" style="margin-bottom:14px">בחרו את הדמות שלכם — אפשר להחליף בכל כניסה</div>
  <div class="charRow">
    <button class="charCard" data-ch="hoodie" onclick="chooseChar('hoodie')"><img alt="">קפוצ'ון</button>
    <button class="charCard" data-ch="casual" onclick="chooseChar('casual')"><img alt="">קז'ואל</button>
    <button class="charCard" data-ch="adventurer" onclick="chooseChar('adventurer')"><img alt="">הרפתקן</button>
    <button class="charCard" data-ch="worker" onclick="chooseChar('worker')"><img alt="">בנאי</button>
    <button class="charCard" data-ch="farmer" onclick="chooseChar('farmer')"><img alt="">חקלאי</button>
  </div>
</div>

<!-- dialogue -->
<div id="dlg">
  <div class="bubble"><div class="who" id="who"></div><div id="txt"></div><div class="next" id="nextH">👆 הקישו להמשך</div></div>
  <div id="chDlg"></div>
</div>

<!-- feelings -->
<div class="ov dimbg" id="ov-feel">
  <div id="torchIn">🔦</div>
  <div class="bigheart" id="heartBig">💗</div>
  <h2 id="feelQ"></h2>
  <div class="ctxTxt" id="feelCtx"></div>
  <div class="feelRow" id="feelRow"></div>
  <div id="feelSteps" style="width:100%;max-width:440px"></div>
</div>

<!-- badge -->
<div class="ov dimbg" id="ov-badge">
  <h1 style="font-size:clamp(24px,6vw,38px)" id="bdgH">🎉 הכלי הראשון שלך!</h1>
  <div class="ctxTxt" id="bdgSub">הפנס הפנימי נכנס לתיק הכלים.</div>
  <div class="slots" id="slots"></div>
  <div id="bdgBtns" style="display:flex;flex-direction:column;gap:10px;align-items:center"></div>
</div>

<!-- family -->
<div class="ov dimbg" id="ov-fam">
  <div class="famCard" id="famBox"></div>
  <button class="btn" style="margin-top:14px" onclick="ovShow('ov-badge')">⬅️ חזרה</button>
</div>

<script>
/* ---------- shared non-module helpers (used by inline onclick) ---------- */
'use strict';
function $(s){return document.querySelector(s)}
function ovShow(id){document.querySelectorAll('.ov').forEach(function(o){o.classList.remove('on')});if(id)$('#'+id).classList.add('on')}
var AC=null;
function snd(f,d,type,vol){try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(!SND)return;var o=AC.createOscillator(),g=AC.createGain();o.type=type||'sine';o.frequency.value=f;g.gain.value=vol||.12;g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+(d||.25));o.connect(g);g.connect(AC.destination);o.start();o.stop(AC.currentTime+(d||.25))}catch(e){}}
function sndTap(){snd(520,.12)} function sndGood(){snd(660,.16);setTimeout(function(){snd(880,.22)},110)}
function sndWarm(){snd(392,.4,'triangle',.1);setTimeout(function(){snd(523,.5,'triangle',.1)},180)}
/* ---- master sound switch (SFX + ambience + TTS), persisted ---- */
var SND=true;try{SND=localStorage.getItem('toolbagSnd')!=='0'}catch(e){}
/* ---- reduced motion preference ---- */
const REDUCED=(function(){try{return matchMedia('(prefers-reduced-motion: reduce)').matches}catch(e){return false}})();
/* ---- קריינות מושבתת בכוונה: בלי קול רובוטי של הדפדפן.
   speak() נשאר כנקודת חיבור לקבצי קול איכותיים (Google AI Studio TTS) ---- */
function speak(t){}
function setSnd(on){
  SND=on;try{localStorage.setItem('toolbagSnd',on?'1':'0')}catch(e){}
  var b=$('#sndBtn');if(b)b.textContent=on?'🔊':'🔇';
  if(window._windGain)try{window._windGain.gain.value=on?.016:0}catch(e){}
  if(on)sndTap();
}
$('#sndBtn').onclick=function(){setSnd(!SND)};
if(!SND)$('#sndBtn').textContent='🔇';
(function(){var h='';for(var i=0;i<34;i++)h+='<i style="top:'+Math.random()*100+'%;right:'+Math.random()*100+'%;animation-delay:'+Math.random()*3+'s"></i>';$('#stars').innerHTML=h})();
function confettiBurst(){
  var c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  var P=[],cols=['#ffd54a','#7dffa8','#8fd3ff','#ff9bb3','#fff'],NP=REDUCED?32:130;
  for(var i=0;i<NP;i++)P.push({x:innerWidth/2,y:innerHeight*.4,vx:(Math.random()-.5)*13,vy:-Math.random()*11-3,s:Math.random()*7+4,c:cols[i%5],r:Math.random()*6});
  var t=0;(function fr(){x.clearRect(0,0,c.width,c.height);t++;
    P.forEach(function(p){p.x+=p.vx;p.y+=p.vy;p.vy+=.3;p.r+=.15;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/2,p.s,p.s*.6);x.restore()});
    if(t<110)requestAnimationFrame(fr);else x.clearRect(0,0,c.width,c.height)})();
}
function showFam(){sndTap();$('#famBox').innerHTML=FAMS[CUR_BADGE];ovShow('ov-fam')}
var TOOLS=['🔦','🐬','🌸','📗','🙋','❓','🛡️'];
var CUR_BADGE=0;
/* tool-progress strip: tapping an earned flower jumps to its practice module */
function renderToolNav(){
  var prog=0;try{prog=+localStorage.getItem('toolbagProg')||0}catch(e){}
  var h='';TOOLS.forEach(function(t,i){
    var earned=i<prog,clickable=earned&&i===2;
    h+='<div class="tn'+(earned?' earned':'')+'"'+(clickable?' onclick="location.href=\'flower.html\'"':'')+'>'+t+'</div>';
  });
  $('#toolNav').innerHTML=h;
}
renderToolNav();
var BADGES=[
  {h:'🎉 הכלי הראשון שלך!',sub:'הפנס הפנימי נכנס לתיק הכלים.<br>עוד 6 כלים מחכים בהמשך המסע...',
   next:'🐬 אל הכלי הבא — דולפיניות!'},
  {h:'🎉 הכלי השני שלך!',sub:'הדולפיניות נכנסה לתיק הכלים.<br>עוד 5 כלים מחכים בהמשך המסע...',
   next:'🌸 אל הכלי הבא — פרח שנפתח!'},
  {h:'🎉 הכלי השלישי שלך!',sub:'הפרח שנפתח נכנס לתיק הכלים.<br>עוד 4 כלים מחכים בהמשך המסע...',
   next:'📗 אל הכלי הבא — התיקיה הירוקה!'},
  {h:'🎉 הכלי הרביעי שלך!',sub:'התיקיה הירוקה נכנסה לתיק הכלים.<br>עוד 3 כלים מחכים בהמשך המסע...',
   next:'🙋 אל הכלי הבא — יוזמה חברתית!'},
  {h:'🎉 הכלי החמישי שלך!',sub:'היוזמה החברתית נכנסה לתיק הכלים.<br>עוד 2 כלים מחכים בהמשך המסע...',
   next:'❓ אל הכלי הבא — אפר״ת!'},
  {h:'🎉 הכלי השישי שלך!',sub:'אפר״ת נכנס לתיק הכלים.<br>נשאר כלי אחרון אחד — הכי אמיץ מכולם...',
   next:'🛡️ אל הכלי האחרון — מגן החברים!'},
  {h:'🏆 תיק הכלים מלא!',sub:'אספת את כל 7 הכלים! 🎒<br>עכשיו יש לך תיק שלם לכל רגע קשה — אלוף אמיתי של חברות!',
   next:null}
];
var FAMS=[
  '<h3>🗣️ מדברים על זה יחד</h3><ul>'+
  '<li>מתי בפעם האחרונה הלב שלך הרגיש כבד? מה הוא הרגיש?</li>'+
  '<li>למה לדעתך זה עוזר להגיד <b>"זה נורמלי להרגיש ככה"</b>?</li>'+
  '<li>מה ההבדל בין להוציא את הכעס החוצה, להחזיק הכל בפנים — ולהדליק פנס פנימי?</li></ul>'+
  '<div class="mission">🌟 <b>משימת האומץ של השבוע:</b> בפעם הבאה שמשהו מציק — עצרו, שאלו "מה הלב שלי מרגיש?", תגידו "זה נורמלי", וחבקו את הלב. ספרו אחר כך למשפחה איך זה היה!</div>',
  '<h3>🗣️ מדברים על זה יחד</h3><ul>'+
  '<li>מתי יצא לך להגיב כמו 🦈 כריש? כמו 🐟 סרדין? מה קרה אחר כך?</li>'+
  '<li>מה הכי קשה בלהגיד "בבקשה להפסיק" בקול רגוע דווקא?</li>'+
  '<li>למה הדולפין קודם <b>צולל פנימה</b> — ורק אחר כך מזנק ומדבר?</li></ul>'+
  '<div class="mission">🌟 <b>משימת האומץ של השבוע:</b> אם מישהו פוגע בכם — צללו פנימה (פנס פנימי!), חבקו את הלב, ואז אמרו בקול בטוח ורגוע: <b>"בבקשה להפסיק"</b>. ספרו בבית איך הלך!</div>',
  '<h3>🗣️ מדברים על זה יחד</h3><ul>'+
  '<li>מה יותר קל — לשאול מישהו על עצמו, או לספר משהו על עצמך? למה?</li>'+

function playA(k,name,once){
  const a=k.actions[name]||k.actions.Idle_Neutral||k.actions.Idle;
  if(!a)return;
  if(k.curName===name&&!once)return;
  if(k.cur)k.cur.fadeOut(.22);
  a.reset().fadeIn(.22).play();
  if(once){a.setLoop(THREE.LoopOnce,1);k.busy=true}else a.setLoop(THREE.LoopRepeat,Infinity);
  k.cur=a;k.curName=name;
}
function loco(k,moving,run){if(k.busy)return;playA(k,moving?(run?'Run':'Walk'):'Idle_Neutral')}

function makeChar(model,targetH,kipColor,kidHead){
  const src=MODELS[model];
  const inner=SkeletonUtils.clone(src.scene);
  inner.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;
    /* PBR materials come out near-black without an env map — flatten to Lambert, keeps the palette */
    o.material=new THREE.MeshLambertMaterial({color:o.material.color});
  }});
  /* NOTE: Box3.setFromObject lies for skinned meshes (bind-pose bones inflate it) — the models are ~2.35u tall, use fixed scale */
  const s=targetH/2.35;
  inner.scale.setScalar(s);
  const g=new THREE.Group();g.add(inner);scene.add(g);
  const mixer=new THREE.AnimationMixer(inner);
  const actions={};
  src.animations.forEach(c=>{actions[c.name.replace(/^.*\|/,'')]=mixer.clipAction(c)});
  const k={g,inner,mixer,actions,cur:null,curName:'',busy:false,target:null,speed:4.4};
  mixer.addEventListener('finished',()=>{k.busy=false;k.cur=null;k.curName='';playA(k,'Idle_Neutral')});
  /* kippah, attached to the head bone so it moves with the animations */
  if(kipColor!==undefined){
    const head=inner.getObjectByName('Head');
    if(head){
      inner.updateMatrixWorld(true);
      const ws=new THREE.Vector3();head.getWorldScale(ws);
      const r=(.06*targetH)/ws.y;
      const kip=new THREE.Mesh(new THREE.SphereGeometry(r,14,10),M(kipColor));
      kip.scale.y=.4;kip.position.y=(.098*targetH)/ws.y;kip.castShadow=false;
      head.add(kip);
    }
  }
  /* kid proportions: enlarge the head bone (skinned verts follow) — kippah is a child so it scales along */
  if(kidHead){const h=inner.getObjectByName('Head');if(h)h.scale.multiplyScalar(kidHead)}
  playA(k,'Idle_Neutral');
  return k;
}
function face(k,v){k.g.rotation.y=Math.atan2(v.x-k.g.position.x,v.z-k.g.position.z)}
function stepTo(k,dt){ /* move kid toward k.target; returns moving? */
  if(!k.target)return false;
  const p=k.g.position,d=new THREE.Vector3().subVectors(k.target,p);d.y=0;
  const dist=d.length();
  if(dist<.15){k.target=null;if(k.onArrive){const f=k.onArrive;k.onArrive=null;f()}return false}
  d.normalize();p.addScaledVector(d,Math.min(k.speed*dt,dist));
  k.g.rotation.y=Math.atan2(d.x,d.z);
  return true;
}

/* ball */
const ball=new THREE.Mesh(new THREE.SphereGeometry(.19,14,12),new THREE.MeshLambertMaterial({color:0xffffff}));
ball.castShadow=true;scene.add(ball);
let ballFrom=kids[0].g.position.clone(),ballTo=kids[2].g.position.clone(),ballT=0,ballHold=0,ballCur=2;
function nextPass(){playA(kids[ballCur],'Kick_Right',true);ballCur=(ballCur+1+Math.floor(Math.random()*3))%5;ballFrom=ball.position.clone();
  /* land the ball right at the receiver's feet — .5 in front, tiny sideways wobble */
  const kp=kids[ballCur].g.position.clone();
  const dir=new THREE.Vector3().subVectors(kp,ballFrom);const L=dir.length();
  if(L>1e-3){dir.normalize();kp.addScaledVector(dir,-.5);kp.x+=(Math.random()-.5)*.25;kp.z+=(Math.random()-.5)*.25}
  ballTo=kp;ballT=0}
function ballBackTo(k){ballFrom=ball.position.clone();const kp=k.g.position.clone();
  const dir=new THREE.Vector3().subVectors(kp,ballFrom);
  if(dir.length()>1e-3){dir.normalize();kp.addScaledVector(dir,-.8)}
  ballTo=kp;ballT=0;ballHold=0}
function ballTick(dt,active){
  if(!active){return}
  if(ballHold>0){ballHold-=dt;if(ballHold<=0)nextPass();return}
  ballT+=dt*1.4;const t=Math.min(ballT,1);
  ball.position.lerpVectors(ballFrom,ballTo,t);
  /* fly OVER the kids' heads, never through their bodies */
  ball.position.y=.19+Math.sin(t*Math.PI)*2.2;
  if(t>=1){ballHold=.5+Math.random()*.8}
  kids.forEach(k=>{if(!k.target){const d=new THREE.Vector3().subVectors(ball.position,k.g.position);k.g.rotation.y=Math.atan2(d.x,d.z)}});
}

function joyHandle(e){

  let dx=(t.clientX-(r.left+60))/48, dy=(t.clientY-(r.top+60))/48;
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  joyV={x:dx,y:dy};knob.style.transform='translate(calc(-50% + '+dx*34+'px), calc(-50% + '+dy*34+'px))';
}

/* ---- ambient sound, fully synthesized (no assets, no copyright) ---- */
let ambOn=false;
function startAmbience(){
  if(ambOn||!AC)return;ambOn=true;
  try{
    /* soft wind: looped filtered noise */
    const len=4*AC.sampleRate,buf=AC.createBuffer(1,len,AC.sampleRate),d=buf.getChannelData(0);
    for(let i=0;i<len;i++)d[i]=Math.random()*2-1;
    const src=AC.createBufferSource();src.buffer=buf;src.loop=true;
    const f=AC.createBiquadFilter();f.type='lowpass';f.frequency.value=300;
    const g=AC.createGain();g.gain.value=SND?.016:0;window._windGain=g;
    src.connect(f);f.connect(g);g.connect(AC.destination);src.start();
  }catch(e){}
  (function birds(){
    setTimeout(()=>{if(NIGHT<.3)chirp();birds()},2600+Math.random()*4600);
  })();
}
function chirp(){
  if(!SND)return;
  try{
    const t=AC.currentTime,n=2+Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const o=AC.createOscillator(),g=AC.createGain();o.type='sine';
      const f0=2700+Math.random()*1600,t0=t+i*.15;
      o.frequency.setValueAtTime(f0,t0);o.frequency.exponentialRampToValueAtTime(f0*.7,t0+.09);
      g.gain.setValueAtTime(0,t0);g.gain.linearRampToValueAtTime(.028,t0+.02);g.gain.exponentialRampToValueAtTime(.0008,t0+.11);
      o.connect(g);g.connect(AC.destination);o.start(t0);o.stop(t0+.13);
    }
  }catch(e){}
}

/* feelings flow (HTML overlay) */
function feelFlow(cfg){
  ovShow('ov-feel');
  const hb=$('#heartBig');hb.textContent='💗';hb.className='bigheart dim';
  const ti=$('#torchIn');ti.style.display='block';
  snd(300,.5,'triangle',.08);
  setTimeout(()=>{hb.classList.remove('dim');snd(660,.3,'triangle',.09)},650);
  setTimeout(()=>{ti.style.display='none'},1600);
  $('#feelQ').textContent='מה הלב מרגיש עכשיו?';
  $('#feelCtx').innerHTML=cfg.ctx||'';
  const row=$('#feelRow');row.innerHTML='';row.style.display='flex';
  $('#feelSteps').innerHTML='';
  cfg.feels.forEach(f=>{
    const d=document.createElement('div');d.className='feel';d.innerHTML='<span>'+f.e+'</span>'+f.n;
    d.onclick=()=>{sndTap();step2(f)};row.appendChild(d);
  });
  function step2(f){
    row.style.display='none';

    $('#feelQ').textContent='זיהית! הלב מרגיש '+f.n+'.';
    $('#feelCtx').innerHTML='עכשיו תגיד לו את משפט הקסם:';
    $('#feelSteps').innerHTML='<button class="btn" id="normBtn">💛 "זה נורמלי להרגיש '+f.n+'"</button>';
    $('#normBtn').onclick=()=>{sndWarm();step3(f)};
  }
  function step3(f){
    $('#feelQ').textContent='יפה מאוד... הלב שומע אותך.';
    $('#feelCtx').innerHTML='נשאר עוד צעד אחד:';
    $('#feelSteps').innerHTML='<button class="btn calm" id="hugBtn">🤗 לחבק את הלב</button>';

      $('#feelSteps').innerHTML='<button class="btn" id="contBtn">ממשיכים ⬅️</button>';

/* =================== main loop =================== */
let soccerActive=true;
const clock=new THREE.Clock();
let markerT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),.05);
  /* player control */
  let moving=false;
  if(MODE==='explore'){
    let vx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0)+joyV.x;
    let vz=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0)+joyV.y;
    const l=Math.hypot(vx,vz);
    if(l>.15){vx/=Math.max(l,1);vz/=Math.max(l,1);
      player.g.position.x+=vx*dt*7;player.g.position.z+=vz*dt*7;
      player.g.position.x=Math.max(BOUNDS.x1,Math.min(BOUNDS.x2,player.g.position.x));
      player.g.position.z=Math.max(BOUNDS.z1,Math.min(BOUNDS.z2,player.g.position.z));
      player.g.rotation.y=Math.atan2(vx,vz);moving=true;
      /* soft collision — can't walk through other characters (free-roam only, never during cinematics) */
      CHARS.forEach(c=>{if(c===player)return;
        const dx=player.g.position.x-c.g.position.x,dz=player.g.position.z-c.g.position.z;
        const d=Math.hypot(dx,dz);
        if(d<.95&&d>1e-4){player.g.position.x=c.g.position.x+dx/d*.95;player.g.position.z=c.g.position.z+dz/d*.95}
      });
      if(INCLASS)STATCOL.forEach(s=>{
        const dx=player.g.position.x-s[0],dz=player.g.position.z-s[1];
        const d=Math.hypot(dx,dz);
        if(d<s[2]&&d>1e-4){player.g.position.x=s[0]+dx/d*s[2];player.g.position.z=s[1]+dz/d*s[2]}
      });
    }
  }
  /* scripted walking (cinematics) */
  if(player.target)moving=stepTo(player,dt)||moving;
  loco(player,moving,true);
  /* kids */
  kids.forEach(k=>{loco(k,stepTo(k,dt),k.speed>5)});
  ballTick(dt,soccerActive);
  CHARS.forEach(c=>c.mixer.update(dt));
  /* quest markers + triggers */
  markerT+=dt;
  marker.rotation.y=markerT*2.4;
  if(!REDUCED)clouds.forEach(c=>{c.position.x+=dt*.55;if(c.position.x>72)c.position.x=-72});
  /* owl life: gentle bob, follows the player with its gaze, blinks */
  if(owl.userData.baseY){
    owl.position.y=owl.userData.baseY+Math.sin(markerT*1.6)*.05;
    const oa=Math.atan2(player.g.position.x-owl.position.x,player.g.position.z-owl.position.z);
    let od=((oa-owl.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    owl.rotation.y+=od*Math.min(dt*2.2,1);
    if(markerT>owl.userData.nextBlink){owl.userData.blinkUntil=markerT+.13;owl.userData.nextBlink=markerT+2.2+Math.random()*2.8}
    const bs=markerT<owl.userData.blinkUntil?.1:1;
    owl.userData.eyes.forEach(e=>{e.scale.y+= (bs-e.scale.y)*Math.min(dt*30,1)});
  }
  if(QUEST===0){marker.position.set(OWLPOS.x+.9,2.8+Math.sin(markerT*3)*.3,OWLPOS.z);
    if(MODE==='explore'&&distTo(OWLPOS)<4.5){actBtn.textContent='🦉 לדבר עם הינשוף';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';QUEST=.5;owlTalk()}}
    else actBtn.style.display='none';
  }else if(QUEST===1){marker.position.set(TEACHER.x,3.6+Math.sin(markerT*3)*.3,TEACHER.z+.9);
    if(MODE==='explore'&&distTo(TEACHER)<5){actBtn.textContent='📄 לקבל את המבחן';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();QUEST=2;startScenario()}}
    else actBtn.style.display='none';
  }else if(QUEST===2.2){marker.visible=true;marker.position.set(DOORP.x-.7,3.1+Math.sin(markerT*3)*.3,DOORP.z);
    if(MODE==='explore'&&distTo(DOORP)<4){actBtn.textContent='🚪 לצאת לחצר';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';exitClass()}}
    else actBtn.style.display='none';
  }else if(QUEST===3){marker.visible=true;marker.position.set(OWLPOS.x,4.4+Math.sin(markerT*3)*.35,OWLPOS.z+1.6);
    if(MODE==='explore'&&distTo(OWLPOS)<5){actBtn.textContent='🦉 לדבר עם הינשוף';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';QUEST=3.5;owlTalk2()}}
    else actBtn.style.display='none';
  }else if(QUEST===4){marker.visible=true;marker.position.set(FIELD.x,3.4+Math.sin(markerT*3)*.35,FIELD.z+5.5);
    if(MODE==='explore'&&distTo(FIELD)<8){actBtn.textContent='⚽ לגשת לילדים';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';QUEST=5;startScenario2()}}
    else actBtn.style.display='none';
  }else if(QUEST>=30&&CFG&&QUEST%10===0){marker.visible=true;
    marker.position.set(OWLPOS.x+CFG.mo[0],CFG.mo[1]+Math.sin(markerT*3)*.3,OWLPOS.z+CFG.mo[2]);
    if(MODE==='explore'&&distTo(OWLPOS)<5){actBtn.textContent='🦉 לדבר עם הינשוף';actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';QUEST+=.5;owlTalkN()}}
    else actBtn.style.display='none';
  }else if(QUEST>=30&&CFG&&QUEST%10===1){marker.visible=true;
    marker.position.set(CFG.scenePos.x,CFG.smY+Math.sin(markerT*3)*.3,CFG.scenePos.z);
    if(MODE==='explore'&&distTo(CFG.scenePos)<CFG.sceneR){actBtn.textContent=CFG.sceneBtn;actBtn.style.display='block';actBtn.onclick=()=>{sndTap();actBtn.style.display='none';QUEST+=1;CFG.startScene()}}
    else actBtn.style.display='none';
  }else marker.visible=false;
  /* floating heart above player */
  if(heartSp.visible){heartSp.position.copy(player.g.position).add(new THREE.Vector3(0,3.6+Math.sin(markerT*2.4)*.2,0))}
  if(chatSp.visible){chatSp.position.copy(player.g.position).add(new THREE.Vector3(.8,3.4,0))}
  camTick(dt);
  composer.render();
}
animate();

/* debug hooks for automated testing */
window._dbg={
  tp:(x,z)=>{player.g.position.set(x,0,z)},
  quest:()=>QUEST, mode:()=>MODE, ch:()=>CH, soccer:()=>soccerActive,
  pos:()=>[+player.g.position.x.toFixed(2),+player.g.position.z.toFixed(2)],
  mind:()=>Math.min(...CHARS.filter(c=>c!==player).map(c=>player.g.position.distanceTo(c.g.position)))
};
