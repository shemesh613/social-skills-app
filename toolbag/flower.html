<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no">
<meta name="theme-color" content="#1a1030">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🌸</text></svg>">
<title>🌸 הפרח — תרגול בשדה הפרחים</title>
<link href="https://fonts.googleapis.com/css2?family=Heebo:wght@400;600;800&family=Frank+Ruhl+Libre:wght@700;900&display=swap" rel="stylesheet">
<style>
/* ============================================================
   הפרח שנפתח — 3D practice meadow (continuation of world.html).
   Calm, predictable, errorless (ASD UX). RTL Hebrew.
   ============================================================ */
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{font-family:'Heebo',sans-serif;background:#1a1030;color:#fff;user-select:none;touch-action:manipulation}
button{font-family:inherit;cursor:pointer;border:none;-webkit-tap-highlight-color:transparent}
#c3d{position:fixed;inset:0;display:block}
canvas#confetti{position:fixed;inset:0;pointer-events:none;z-index:60}

/* ---------- top bar ---------- */
#topbar{position:fixed;top:0;left:0;right:0;height:60px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;z-index:30;pointer-events:none}
.tbBtn{pointer-events:auto;min-width:50px;min-height:50px;border-radius:16px;background:rgba(20,14,50,.72);border:1.5px solid rgba(255,213,74,.55);font-size:19px;font-weight:800;color:#ffd54a;padding:0 12px;box-shadow:0 6px 20px rgba(0,0,0,.35);transition:transform .1s}
.tbBtn:active{transform:translateY(2px)}
#tbTitle{pointer-events:none;font-family:'Frank Ruhl Libre',serif;font-size:clamp(15px,4vw,21px);font-weight:900;color:#ffd54a;text-shadow:0 2px 12px rgba(0,0,0,.6);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}

/* ---------- tool-progress strip — continuity with the world's 7 tools ---------- */
#toolNav{position:fixed;top:64px;left:50%;transform:translateX(-50%);display:flex;gap:6px;z-index:29;background:rgba(20,14,50,.55);border-radius:16px;padding:5px 8px;pointer-events:none}
#toolNav .tn{width:26px;height:26px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:14px;opacity:.35;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.18)}
#toolNav .tn.earned{opacity:.75}
#toolNav .tn.cur{opacity:1;background:rgba(255,213,74,.22);border-color:#ffd54a;box-shadow:0 0 10px rgba(255,213,74,.5)}

/* ---------- progress dots (petals of current round) ---------- */
#dots{position:fixed;top:104px;left:50%;transform:translateX(-50%);display:none;gap:7px;z-index:30;background:rgba(20,14,50,.55);border-radius:20px;padding:6px 12px}
#dots.on{display:flex}
#dots i{width:13px;height:13px;border-radius:50%;background:rgba(255,255,255,.22);border:1.5px solid rgba(255,255,255,.3);transition:background .3s,transform .3s}
#dots i.f{background:#ffd54a;border-color:#f5a623;transform:scale(1.18)}

/* ---------- free-roam controls (matches world.html) ---------- */
#joy{position:fixed;bottom:26px;right:26px;width:120px;height:120px;border-radius:50%;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.28);z-index:25;touch-action:none;display:none}
#knob{position:absolute;top:50%;left:50%;width:52px;height:52px;border-radius:50%;background:rgba(255,213,74,.85);transform:translate(-50%,-50%);box-shadow:0 4px 14px rgba(0,0,0,.4)}
.keysHint{position:fixed;bottom:158px;right:26px;background:rgba(20,14,50,.6);color:#ffe9a8;font-size:13px;font-weight:700;padding:8px 14px;border-radius:14px;z-index:25;display:none;text-align:center}
#act{position:fixed;left:50%;bottom:110px;transform:translateX(-50%);z-index:24;display:none;min-height:56px;padding:0 22px;border-radius:16px;font-size:17px;font-weight:800;background:linear-gradient(180deg,#ffd54a,#f5a623);color:#4a2c00;box-shadow:0 6px 0 #b57712,0 10px 24px rgba(0,0,0,.35)}

/* ---------- dialogue bubble (bottom, over 3D) ---------- */
#dlg{position:fixed;left:0;right:0;bottom:0;padding:14px;z-index:22;display:none}
#dlg.on{display:block}
.bubble{position:relative;max-width:620px;margin:0 auto;background:#fffef2;color:#3a2c10;border-radius:20px;padding:16px 20px 12px;font-size:clamp(16px,2.4vh,19px);line-height:1.65;font-weight:600;min-height:84px;box-shadow:0 12px 34px rgba(0,0,0,.5)}
.who{position:absolute;top:-15px;right:14px;background:#ffd54a;color:#4a2c00;font-size:13.5px;font-weight:800;border-radius:20px;padding:2px 12px}
.next{text-align:center;font-size:13.5px;color:#a15c00;opacity:.85;margin-top:6px;animation:tw 1.6s infinite}
@keyframes tw{0%,100%{opacity:.25}50%{opacity:.95}}

/* ---------- exercise panel (bottom sheet over 3D) ---------- */
#panel{position:fixed;left:0;right:0;bottom:0;z-index:24;display:none;justify-content:center;padding:10px;max-height:72dvh;overflow-y:auto}
#panel.on{display:flex}
.pCard{width:100%;max-width:560px;background:rgba(22,15,52,.9);backdrop-filter:blur(4px);border:1.5px solid rgba(255,213,74,.4);border-radius:22px;padding:16px 14px;display:flex;flex-direction:column;align-items:center;gap:10px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:fadeUp .35s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}
.qTitle{font-size:clamp(18px,4.4vw,22px);font-weight:800;color:#ffe9a8;text-align:center;line-height:1.4}
.sub{font-size:15px;color:#cfc4ea;text-align:center;line-height:1.6;max-width:480px}
.optGrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:9px;width:100%}
.optGrid.one{grid-template-columns:1fr}
.optCard{min-height:64px;padding:10px 8px;border-radius:18px;background:rgba(255,255,255,.09);border:2px solid rgba(255,255,255,.3);font-size:16px;font-weight:800;color:#fff;line-height:1.45;transition:transform .12s}
.optCard:active{transform:scale(.95)}
.optCard .big{display:block;font-size:33px;margin-bottom:3px;pointer-events:none}
.optCard.hint{animation:pulse 1s infinite;border-color:#7dffa8;background:rgba(60,150,80,.25)}
.optCard.dim{opacity:.32;pointer-events:none}
.optCard.picked{border-color:#ffd54a;background:rgba(255,213,74,.2)}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.05)}}
.btn{display:block;width:100%;max-width:420px;margin:4px auto;padding:14px 22px;min-height:56px;border-radius:16px;font-size:18px;font-weight:800;background:linear-gradient(180deg,#ffd54a,#f5a623);color:#4a2c00;box-shadow:0 6px 0 #b57712,0 10px 24px rgba(0,0,0,.35);transition:transform .1s}
.btn:active{transform:translateY(4px);box-shadow:0 2px 0 #b57712}
.btn.sec{background:linear-gradient(180deg,#3c477f,#2a3260);color:#dfe6ff;box-shadow:0 6px 0 #1a2040}
.btn.grn{background:linear-gradient(180deg,#7dffa8,#25c05f);color:#053514;box-shadow:0 6px 0 #128040}
.btn[disabled]{opacity:.45;pointer-events:none}
.sentence{font-size:clamp(19px,5vw,25px);font-weight:800;color:#ffe9a8;background:rgba(255,213,74,.12);border:2px solid rgba(255,213,74,.5);border-radius:18px;padding:12px 18px;text-align:center;line-height:1.5;width:100%}
.sayLoud{font-size:17px;font-weight:800;color:#7dffa8;text-align:center;animation:pulse 1.4s infinite}
.bub{position:relative;width:100%;background:#fffef2;border-radius:18px;padding:14px 16px;font-size:clamp(15px,3.8vw,18px);font-weight:600;line-height:1.6;color:#3a2c10;animation:fadeUp .4s ease}
.bub .who2{position:absolute;top:-13px;right:14px;background:#ffd54a;color:#4a2c00;font-size:12.5px;font-weight:800;border-radius:20px;padding:2px 12px}
.bub.me{background:#eaf7e2}
.bub.me .who2{background:#25c05f;color:#fff}
/* ---------- level 5 rings ---------- */
.ringRow{display:grid;grid-template-columns:repeat(auto-fit,minmax(105px,1fr));gap:9px;width:100%}
.ringBtn{min-height:78px;border-radius:18px;font-size:15px;font-weight:800;border:3px solid;transition:transform .12s;background:rgba(255,255,255,.08);color:#fff}
.ringBtn:active{transform:scale(.95)}
.ringBtn .big{display:block;font-size:30px;margin-bottom:2px}
.ringBtn.r0{border-color:#7ea6e0}.ringBtn.r1{border-color:#8cc07a}
.ringBtn.r2{border-color:#e8c34f}.ringBtn.r3{border-color:#b9b4ac}
.ringBtn.dim{opacity:.3;pointer-events:none}
.ringBtn.hint{animation:pulse 1s infinite}
.ringBtn.picked{background:rgba(255,213,74,.2)}
.shareCard{width:100%;background:#fffef2;border-radius:20px;padding:14px 18px;font-size:clamp(18px,4.6vw,22px);font-weight:800;color:#3a2c10;text-align:center;transition:transform .5s ease}
.shareCard .big{display:block;font-size:40px;margin-bottom:4px}
.shareCard.fold{transform:scaleY(.06);opacity:.4}

/* ---------- full-screen overlays (home/menu/ceremony) ---------- */
.ov{position:fixed;inset:0;display:none;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;z-index:40;overflow-y:auto}
.ov.on{display:flex}
.ov.dimbg{background:rgba(8,6,28,.6);backdrop-filter:blur(2px)}
h1{font-family:'Frank Ruhl Libre',serif;font-size:clamp(26px,7vw,44px);color:#ffd54a;text-shadow:0 4px 24px rgba(0,0,0,.5);text-align:center}
h2{font-family:'Frank Ruhl Libre',serif;font-size:clamp(19px,4.5vw,26px);color:#ffd54a;text-align:center;line-height:1.35}
.lvGrid{display:flex;flex-direction:column;gap:9px;width:100%;max-width:440px}
.lvCard{display:flex;align-items:center;gap:12px;width:100%;min-height:64px;padding:8px 14px;border-radius:18px;background:rgba(22,15,52,.85);border:2px solid rgba(255,213,74,.4);font-size:16px;font-weight:800;color:#fff;text-align:right;transition:transform .1s}
.lvCard:active{transform:translateY(2px)}
.lvCard .ic{font-size:30px;flex:0 0 40px;text-align:center}
.lvCard .nm{flex:1}
.lvCard .st{font-size:13px;color:#ffd54a;letter-spacing:1px}
.lvCard.locked{opacity:.45;filter:grayscale(.6)}
.homeRow{display:flex;gap:9px;width:100%;max-width:440px}
.homeRow .btn{margin:0;flex:1;min-height:52px;font-size:16px}
.classToggle{display:flex;align-items:center;justify-content:center;gap:10px;font-size:15px;font-weight:700;color:#cfc4ea;cursor:pointer}
.sw{position:relative;width:54px;height:30px;border-radius:20px;background:rgba(255,255,255,.2);transition:background .2s;flex:0 0 auto}
.sw.on{background:#25c05f}
.sw i{position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .2s}
.sw.on i{transform:translateX(-24px)}
.pickGrid{display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:100%;max-width:460px}
.pickCard{min-width:92px;min-height:92px;padding:10px;border-radius:18px;background:rgba(255,255,255,.09);border:3px solid rgba(255,255,255,.3);font-size:16px;font-weight:800;color:#fff;transition:transform .12s}
.pickCard:active{transform:scale(.94)}
.pickCard .big{display:block;font-size:40px;margin-bottom:4px}
.pickCard .dot{display:block;width:40px;height:40px;border-radius:50%;margin:0 auto 6px;border:3px solid rgba(255,255,255,.7)}

/* ---------- torch overlay (transparent — the 3D scene is the stage) ---------- */
#ov-torch{background:transparent;pointer-events:none;justify-content:flex-end;padding-bottom:16px}
#ov-torch .tCard{pointer-events:auto;width:100%;max-width:520px;background:rgba(12,8,34,.82);border:1.5px solid rgba(255,213,74,.45);border-radius:20px;padding:14px;display:flex;flex-direction:column;align-items:center;gap:9px;box-shadow:0 14px 40px rgba(0,0,0,.6)}
.wordRow{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.wBtn{min-height:52px;padding:10px 16px;border-radius:14px;font-size:19px;font-weight:800;background:rgba(255,255,255,.1);border:2px solid rgba(255,255,255,.35);color:rgba(255,255,255,.55);transition:all .25s}
.wBtn.lit{color:#4a2c00;background:#ffd54a;border-color:#fff3c0;box-shadow:0 0 18px rgba(255,213,74,.8)}

/* ---------- loading / fallback / fade ---------- */
#loading{position:fixed;inset:0;background:#1a1030;z-index:90;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;transition:opacity .6s}
#loading .fl{font-size:74px;animation:pulse 1.6s infinite}
#loadTxt{font-size:16px;font-weight:700;color:#cfc4ea}
#whiteFade{position:fixed;inset:0;background:#fffef2;opacity:0;transition:opacity 1.1s;pointer-events:none;z-index:85}
#fallback{position:fixed;inset:0;background:#1a1030;z-index:95;display:none;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:24px;text-align:center}
.spark{position:fixed;font-size:22px;pointer-events:none;z-index:80}
.gLabel{position:fixed;transform:translate(-50%,-100%);background:rgba(22,15,52,.85);border:1.5px solid rgba(255,213,74,.5);border-radius:14px;padding:4px 10px;font-size:13px;font-weight:800;color:#ffe9a8;pointer-events:none;z-index:18;white-space:nowrap}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.15s!important}
}
</style>
<script type="importmap">{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js","three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"}}</script>

<body>
<canvas id="c3d"></canvas>
<canvas id="confetti"></canvas>
<div id="whiteFade"></div>

<div id="topbar">
  <button class="tbBtn" id="homeBtn" style="display:none">🏠</button>
  <button class="tbBtn" id="backBtn">🎒 לעולם</button>
  <div id="tbTitle">🌸 הפרח שנפתח</div>
  <button class="tbBtn muteBtn" onclick="toggleSound()">🔊</button>
</div>
<div id="toolNav"></div>
<div id="dots"></div>

<!-- free-roam controls -->
<div id="joy"><div id="knob"></div></div>
<div class="keysHint" id="keysHint">🎮 חצים / WASD לתנועה</div>
<button id="act"></button>

<!-- dialogue -->
<div id="dlg">
  <div class="bubble"><div class="who" id="who"></div><div id="txt"></div>
    <div class="next" id="nextH">👆 לחצו להמשך</div></div>
</div>

<!-- exercise panel -->
<div id="panel"><div class="pCard" id="stage"></div></div>

<!-- home -->
<div class="ov dimbg" id="ov-home">
  <div style="font-size:60px">🌸</div>
  <h1>הפרח שנפתח</h1>
  <div class="sub" id="greet"></div>
  <div class="lvGrid" id="lvGrid"></div>
  <div class="homeRow">
    <button class="btn grn" onclick="openGarden()">🌷 הגינה שלי <span id="gCount"></span></button>
    <button class="btn sec" id="photoBtn" onclick="snapPhoto()">📸 לשמור תמונה</button>
  </div>
  <div class="classToggle" onclick="toggleClass()">🍎 מצב כיתה <div class="sw" id="swClass"><i></i></div></div>
</div>

<!-- setup -->
<div class="ov dimbg" id="ov-setup"><div id="setupStage" style="width:100%;display:flex;flex-direction:column;align-items:center;gap:12px"></div></div>

<!-- torch (inner flashlight) -->
<div class="ov" id="ov-torch"><div class="tCard" id="torchCard"></div></div>

<!-- class mode gate -->
<div class="ov dimbg" id="ov-class">
  <div style="font-size:58px">🗣️</div>
  <h2>עכשיו ספר לחבר אמיתי!</h2>
  <div class="sub">אמרו את מה ששיתפתם — לחבר בכיתה או למורה.<br>אחר כך לחצו על הווי הגדול ✓</div>
  <button class="btn grn" id="classCheck" style="max-width:180px;font-size:30px;min-height:80px">✓</button>
</div>

<!-- garden panel (labels drawn over 3D) -->
<div id="gardenUI" style="display:none;position:fixed;left:0;right:0;bottom:0;z-index:24;padding:12px">
  <div style="max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:8px">
    <div class="sub" id="gardenSub" style="background:rgba(12,8,34,.75);border-radius:14px;padding:8px 12px;max-width:none"></div>
    <div style="display:flex;gap:8px">
      <button class="btn" style="margin:0;flex:1" onclick="closeGarden()">🏠 חזרה</button>
      <button class="btn sec" style="margin:0;flex:1" onclick="snapPhoto()">📸 תמונה</button>
    </div>
  </div>
</div>

<!-- loading -->
<div id="loading"><div class="fl">🌸</div><div id="loadTxt">טוענים את שדה הפרחים... 0/9</div></div>

<!-- webgl fallback -->
<div id="fallback">
  <div style="font-size:60px">🌸</div>
  <h2>אופס — המכשיר לא הצליח לפתוח את השדה</h2>
  <div class="sub">נסו לרענן את הדף, או חזרו לעולם התיק 🎒</div>
  <button class="btn" onclick="location.reload()">🔄 לרענן</button>
  <button class="btn sec" onclick="location.href='world.html'">🎒 חזרה לעולם</button>
</div>
<script>
'use strict';
/* ================= utils ================= */
const $=s=>document.querySelector(s);
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=(Math.random()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const rnd=a=>a[(Math.random()*a.length)|0];
const RM=matchMedia('(prefers-reduced-motion: reduce)').matches;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const DAYSEED=+new Date().toISOString().slice(0,10).replace(/-/g,'');
function dayShuffle(arr,salt){const r=mulberry32(DAYSEED+salt*97);const a=arr.slice();
  for(let i=a.length-1;i>0;i--){const j=(r()*(i+1))|0;[a[i],a[j]]=[a[j],a[i]]}return a}

/* ================= state — perachV1 (schema unchanged, old saves keep working) ================= */
const DEF={
  levels:{1:{done:0,stars:0,plays:0},2:{done:0,stars:0,plays:0},3:{done:0,stars:0,plays:0},4:{done:0,stars:0,plays:0},5:{done:0,stars:0,plays:0}},
  bank:[],garden:[],settings:{sound:true,classMode:false},
  profile:{color:null,topic:null},cur:{petals:0}
};
let S;
function load(){
  try{const raw=JSON.parse(localStorage.getItem('perachV1'));
    S=Object.assign({},DEF,raw||{});
    S.levels=Object.assign({},DEF.levels,S.levels);
    S.settings=Object.assign({},DEF.settings,S.settings);
    S.profile=Object.assign({},DEF.profile,S.profile);
    S.cur=Object.assign({},DEF.cur,S.cur);
    S.bank=Array.isArray(S.bank)?S.bank:[];S.garden=Array.isArray(S.garden)?S.garden:[];
  }catch(e){S=JSON.parse(JSON.stringify(DEF))}
}
function save(){try{localStorage.setItem('perachV1',JSON.stringify(S))}catch(e){}}
load();

/* ---------- tool-progress strip: same 7 tools as the world, for continuity ---------- */
function renderToolNav(){
  const TOOLS=['🔦','🐬','🌸','📗','🙋','❓','🛡️'];
  let prog=0;try{prog=+localStorage.getItem('toolbagProg')||0}catch(e){}
  $('#toolNav').innerHTML=TOOLS.map((t,i)=>
    `<div class="tn${i===2?' cur':(i<prog?' earned':'')}">${t}</div>`).join('');
}
renderToolNav();

/* ================= WebAudio (no assets) ================= */
let AC=null;
const actx=()=>AC||(AC=new (window.AudioContext||window.webkitAudioContext)());
function tone(f,dur,type,when,vol){
  if(!S.settings.sound)return;
  try{const c=actx(),o=c.createOscillator(),g=c.createGain(),t=c.currentTime+(when||0);
    o.type=type||'sine';o.frequency.value=f;o.connect(g);g.connect(c.destination);
    g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(vol||.16,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+(dur||.2));o.start(t);o.stop(t+(dur||.2));
  }catch(e){}
}
const PENTA=[523,587,659,784,880,1047,1175,1319]; /* 8 steps — one per petal */
const sndTap=()=>tone(rnd(PENTA.slice(0,5)),.1,'sine',0,.09);
const sndGood=()=>{tone(660,.16,'sine',0,.13);tone(880,.22,'sine',.11,.13)};
const sndSoft=()=>{tone(300,.18,'sine',0,.11);tone(240,.22,'sine',.12,.09)};
const sndWarm=()=>{tone(392,.4,'triangle',0,.1);tone(523,.5,'triangle',.18,.1)};
const sndWin=()=>[523,659,784,1047].forEach((f,i)=>tone(f,.22,'triangle',i*.1,.17));
function sndPetalN(i){tone(PENTA[Math.min(i,7)],.5,'triangle',0,.17);tone(PENTA[Math.min(i,7)]*2,.4,'sine',.04,.05)}
function sndMelody(){PENTA.forEach((f,i)=>tone(f,.25,'triangle',i*.16,.15))}
function sndChime3(){[659,830,988].forEach((f,i)=>tone(f,.5,'triangle',i*.22,.13))}
/* 60-BPM lub-dub heartbeat — returns a stop() */
function heartbeatStart(){
  let on=true;

  inner.traverse(o=>{if(o.isMesh){o.castShadow=true;o.frustumCulled=false;

  mixer.addEventListener('finished',()=>{k.busy=false;k.cur=null;k.curName='';playA(k,'Idle_Neutral')});
  /* optional small colored kippah on the head, sized to follow it */
  if(kipColor!==undefined){
    const head=inner.getObjectByName('Head');
    if(head){
      inner.updateMatrixWorld(true);
      const ws=new THREE.Vector3();head.getWorldScale(ws);
      const r=(.06*targetH)/ws.y;

  /* kept in a tight cluster around the blanket (-2,20) — a narrow-portrait establishing shot
     has a much narrower horizontal FOV than vertical, so a wide spread falls outside the frame */
  const pairs=[
    {a:new THREE.Vector3(-4.5,0,18.5),b:new THREE.Vector3(-3,0,19),path:[new THREE.Vector3(-4.5,0,18.5),new THREE.Vector3(-1,0,20.5),new THREE.Vector3(-3.5,0,21.5)]},
    {a:new THREE.Vector3(0,0,21),b:new THREE.Vector3(1.3,0,20.5),path:[new THREE.Vector3(0,0,21),new THREE.Vector3(-2,0,19),new THREE.Vector3(1,0,18.5)]}
  ];
  pairs.forEach((p,pi)=>{
    [p.a,p.b].forEach((start,side)=>{
      const idx=pi*2+side;
      const k=makeChar(kidGLResolved[idx],1.52,1.55,KIDCOL[idx]);
      k.g.position.copy(start);
      NPCS.push({k,path:p.path,side,wi:1,speed:1.5+Math.random()*.3});
    });
  });
}
function updateNPCs(dt){
  NPCS.forEach(n=>{
    const target=n.path[n.wi].clone();
    if(n.side===1)target.x+=1.7; /* walk shoulder-to-shoulder, offset from the pair's path */
    const d=new THREE.Vector3().subVectors(target,n.k.g.position);d.y=0;
    const dist=d.length();
    if(dist<.3){n.wi=(n.wi+1)%n.path.length;return}
    d.normalize();
    n.k.g.position.x+=d.x*n.speed*dt;n.k.g.position.z+=d.z*n.speed*dt;
    n.k.g.rotation.y=Math.atan2(d.x,d.z);
    playA(n.k,'Walk');n.k.mixer.update(dt);
  });
}
function place(key,x,z,targetH,ry,tint){
  const m=STAT[key].clone(true);
  m.traverse(o=>{if(o.isMesh){o.castShadow=true;o.receiveShadow=true;const om=o.material;o.material=new THREE.MeshLambertMaterial({color:tint!==undefined?tint:om.color,map:om.map||null})}});
  const bb=new THREE.Box3().setFromObject(m);const s=targetH/(bb.max.y-bb.min.y);
  m.scale.setScalar(s);m.position.set(x,-bb.min.y*s,z);m.rotation.y=(ry===undefined)?Math.random()*6.283:ry;
  scene.add(m);return m;
}

/* ================= the child's 3D flower — grows petal by petal ================= */
function shade3(hex,f){const n=parseInt(hex.slice(1),16);let r=n>>16,g=(n>>8)&255,b=n&255;
  const m=c=>Math.max(0,Math.min(255,Math.round(f>0?c+(255-c)*f:c*(1+f))));return (m(r)<<16)|(m(g)<<8)|m(b)}
function buildFlower3D(colorHex){
  const color=colorHex?parseInt(colorHex.slice(1),16):0xff9ec4;
  const grp=new THREE.Group();
  const stem=new THREE.Mesh(new THREE.CylinderGeometry(.045,.06,1.15,8),new THREE.MeshLambertMaterial({color:0x6f9e58}));
  stem.position.y=.575;stem.castShadow=true;grp.add(stem);
  [[.16,.72,.5],[-.16,.5,-.4]].forEach(l=>{
    const leaf=new THREE.Mesh(new THREE.SphereGeometry(.16,10,8),new THREE.MeshLambertMaterial({color:0x7fb069}));
    leaf.scale.set(1,.28,.55);leaf.position.set(l[0],l[1],0);leaf.rotation.z=l[2];grp.add(leaf)});
  const head=new THREE.Group();head.position.y=1.16;grp.add(head);
  const center=new THREE.Mesh(new THREE.SphereGeometry(.11,14,10),new THREE.MeshLambertMaterial({color:0xffdf8e,emissive:0x332200,emissiveIntensity:.15}));
  head.add(center);
  const petals=[];
  for(let i=0;i<8;i++){
    const pivot=new THREE.Group();pivot.rotation.y=i*(Math.PI*2/8);
    const geo=new THREE.SphereGeometry(.16,10,8);
    const mat=new THREE.MeshLambertMaterial({color:i%2?color:shade3('#'+color.toString(16).padStart(6,'0'),.4)});
    const p=new THREE.Mesh(geo,mat);
    p.scale.set(.62,.24,1.15);p.position.set(0,0,.19);p.rotation.x=-.55;
    p.userData.baseRotX=p.rotation.x;
    pivot.add(p);pivot.scale.set(.001,.001,.001);
    head.add(pivot);petals.push({pivot,mesh:p,open:false});
  }
  grp.userData.petals=petals;grp.userData.head=head;grp.userData.color=color;
  return grp;
}
/* animate one petal opening: quiver 0.6s, then ~2s overshoot ease + glow burst */
function openPetal3D(flower,i,cb){
  const P=flower.userData.petals[i];if(!P)return cb&&cb();
  const t0=performance.now();
  (function quiver(){const t=(performance.now()-t0)/600;
    if(t<1){P.pivot.rotation.z=Math.sin(t*26)*.09*(1-t);requestAnimationFrame(quiver)}
    else{P.pivot.rotation.z=0;bloomPetal()}})();
  function bloomPetal(){
    const t1=performance.now();
    (function grow(){const t=Math.min((performance.now()-t1)/1900,1);
      const k=t<1?1-Math.pow(1-t,3)*Math.cos(t*4):1; /* overshoot ease-out */
      const s=Math.max(.001,k);
      P.pivot.scale.set(s,s,s);
      if(t<1)requestAnimationFrame(grow);
      else{P.pivot.scale.set(1,1,1);P.open=true;sndPetalN(i);sparklesAt(innerWidth/2,innerHeight*.4,4);cb&&cb()}
    })();
  }
}
function resetFlower3D(flower){
  flower.userData.petals.forEach(P=>{P.pivot.scale.set(.001,.001,.001);P.open=false});
}

/* the player's flower — placed just beside the child, at the picnic spot */

homeFlower3D.position.set(1.6,0,10.6);homeFlower3D.scale.setScalar(1.35);

/* ================= camera: free-roam follow + cinematic glide spots ================= */
let camPos=new THREE.Vector3(0,5,16),camLook=new THREE.Vector3(0,1.2,8);
let camTargetPos=camPos.clone(),camTargetLook=camLook.clone();
let camMode='fixed'; /* 'follow' = trails the player during free walking; 'fixed' = cinematic glide to a spot */
function camSpot(pos,look){camMode='fixed';camTargetPos=pos.clone();camTargetLook=look.clone()}
camSpot(new THREE.Vector3(6,4.4,17),new THREE.Vector3(1,1.3,9));

/* ================= free movement — WASD / arrows / on-screen joystick, matches world.html ================= */
let MODE='cine'; /* 'cine' (dialogue/ritual, no movement) | 'explore' (free walking) */
const BOUNDS={x1:-37,x2:37,z1:-26,z2:32};
const keys={};
addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true});
addEventListener('keyup',e=>{keys[e.key.toLowerCase()]=false});
let joyV={x:0,y:0};
const joyEl=document.getElementById('joy'),knobEl=document.getElementById('knob');
function joyHandle(e){
  const t=e.touches?e.touches[0]:e;const r=joyEl.getBoundingClientRect();
  let dx=(t.clientX-(r.left+60))/48,dy=(t.clientY-(r.top+60))/48;
  const l=Math.hypot(dx,dy);if(l>1){dx/=l;dy/=l}
  joyV={x:dx,y:dy};knobEl.style.transform='translate(calc(-50% + '+dx*34+'px), calc(-50% + '+dy*34+'px))';
}
joyEl.addEventListener('pointerdown',e=>{joyEl.setPointerCapture(e.pointerId);joyHandle(e)});
joyEl.addEventListener('pointermove',e=>{if(e.buttons)joyHandle(e)});
joyEl.addEventListener('pointerup',()=>{joyV={x:0,y:0};knobEl.style.transform='translate(-50%,-50%)'});
function enterExplore(){MODE='explore';camMode='follow';
  /* show BOTH controls always — draggable joystick works with mouse too, and keyboard always works;
     showing only one based on touch-detection made movement easy to miss */
  document.getElementById('joy').style.display='block';
  document.getElementById('keysHint').style.display='block';
}
function enterCine(){MODE='cine';document.getElementById('joy').style.display='none';document.getElementById('keysHint').style.display='none';document.getElementById('act').style.display='none'}

/* ================= animate loop ================= */
const clock=new THREE.Clock();let markerT=0,running=true;
document.addEventListener('visibilitychange',()=>{running=!document.hidden});
function animate(){
  requestAnimationFrame(animate);
  if(!running)return;
  const dt=Math.min(clock.getDelta(),.05);
  markerT+=dt;
  if(!RM)clouds.forEach(c=>{c.position.x+=dt*.5;if(c.position.x>60)c.position.x=-60});
  starsMat.opacity+=(NIGHT*.9-starsMat.opacity)*Math.min(dt*2,1);
  /* player free movement */
  let moving=false;
  if(MODE==='explore'&&player){
    let vx=(keys['arrowright']||keys['d']?1:0)-(keys['arrowleft']||keys['a']?1:0)+joyV.x;
    let vz=(keys['arrowdown']||keys['s']?1:0)-(keys['arrowup']||keys['w']?1:0)+joyV.y;
    const l=Math.hypot(vx,vz);
    if(l>.15){vx/=Math.max(l,1);vz/=Math.max(l,1);
      player.g.position.x+=vx*dt*6.2;player.g.position.z+=vz*dt*6.2;
      player.g.position.x=Math.max(BOUNDS.x1,Math.min(BOUNDS.x2,player.g.position.x));
      player.g.position.z=Math.max(BOUNDS.z1,Math.min(BOUNDS.z2,player.g.position.z));
      player.g.rotation.y=Math.atan2(vx,vz);moving=true;
    }
  }
  if(player)playA(player,moving?'Walk':'Idle_Neutral');
  updateNPCs(dt);
  /* owl life: bob, gaze at player, blink */
  owl.position.y=owl.userData.baseY+Math.sin(markerT*1.6)*.05;
  if(player){
    const oa=Math.atan2(player.g.position.x-owl.position.x,player.g.position.z-owl.position.z);
    let od=((oa-owl.rotation.y+Math.PI)%(Math.PI*2)+Math.PI*2)%(Math.PI*2)-Math.PI;
    owl.rotation.y+=od*Math.min(dt*2.2,1);
    player.mixer&&player.mixer.update(dt);
  }
  if(markerT>owl.userData.nextBlink){owl.userData.blinkUntil=markerT+.13;owl.userData.nextBlink=markerT+2.2+Math.random()*2.8}
  const bs=markerT<owl.userData.blinkUntil?.1:1;
  owl.userData.eyes.forEach(e=>{e.scale.y+=(bs-e.scale.y)*Math.min(dt*30,1)});
  /* camera: follow while exploring, glide to a fixed cinematic spot otherwise */
  if(camMode==='follow'&&player){
    camTargetPos.copy(player.g.position).add(new THREE.Vector3(0,4.4,6.4));
    camTargetLook.copy(player.g.position).add(new THREE.Vector3(0,1.3,0));
  }
  camPos.lerp(camTargetPos,Math.min(dt*(camMode==='follow'?3.2:2.4),1));
  camLook.lerp(camTargetLook,Math.min(dt*(camMode==='follow'?3.2:2.4),1));
  cam.position.copy(camPos);cam.lookAt(camLook);
  renderer.render(scene,cam);
}
animate();

function worldToScreen(v){const p=v.clone().project(cam);return{x:(p.x*.5+.5)*innerWidth,y:(-p.y*.5+.5)*innerHeight}}
function snapPhotoNow(){renderer.render(scene,cam);try{return renderer.domElement.toDataURL('image/png')}catch(e){return null}}
function faceOwl(){if(player)player.g.rotation.y=Math.atan2(owl.position.x-player.g.position.x,owl.position.z-player.g.position.z)}
window.FLOWER3D={buildFlower3D,openPetal3D,resetFlower3D,homeFlower3D,camSpot,scene,cam,renderer,owl,emojiSprite,setNight,
  torchLight,get player(){return player},THREE,place,STAT,worldToScreen,snapPhotoNow,shade3,
  enterExplore,enterCine,faceOwl,get MODE(){return MODE},set actLabel(t){document.getElementById('act').textContent=t},
  get actBtn(){return document.getElementById('act')}};
}catch(err){
  console.error('flower.html 3D init failed',err);
  document.getElementById('loading').style.display='none';
  document.getElementById('fallback').style.display='flex';
}

<script>

  typeTimer=setInterval(()=>{i++;if(i>=chars.length){clearInterval(typeTimer);el.innerHTML=html;typing=false;return}el.textContent=chars.slice(0,i).join('')},20)}

  const nxt=LV<2&&S.levels[LV+1]&&S.levels[LV].done>=1?LV+1:null;
  const nxtAction=nxt===2?'goShareWithFriend()':`startLevel(${nxt})`;
  openPanel(`<div style="font-size:56px">🎉</div><h2>כל הכבוד! סיימת את השלב!</h2>
    <div style="font-size:24px;letter-spacing:3px;color:#ffd54a">${'⭐'.repeat(lv.stars)}</div>
    <button class="btn" onclick="startLevel(${LV})">🔁 לשחק שוב</button>
    ${nxt&&S.levels[nxt].done===0?`<button class="btn grn" onclick="${nxtAction}">${LEVELS[nxt].icon} לשלב הבא!</button>`:''}
    <button class="btn sec" onclick="goHome()">🏠 חזרה הביתה</button>`);
}
/* bridge from level 1 (private thinking) to level 2 (saying it out loud to a friend) —
   courage was already found once at the flashlight scene, so this is just a short cheer-on */
function goShareWithFriend(){
  closePanel();sndTap();
  if(window.FLOWER3D)window.FLOWER3D.enterCine();
  say([{who:'🦉 הינשוף',t:'יפה מאוד! עכשיו בוא ננסה לספר אחד מהדברים האלה לחבר, בקול 🗣️'}],()=>startLevel(2));
}
function startLevel(n){
  sndTap();LV=n;PROG=0;GOAL=LEVELS[n].goal;S.levels[n].plays++;save();
  if(window.FLOWER3D)window.FLOWER3D.enterCine();
  hideAllOv();$('#backBtn').style.display='none';$('#homeBtn').style.display='block';
  $('#tbTitle').textContent=LVMETA[n].icon+' שלב '+n+' · '+LVMETA[n].name;
  paintSound();renderDots();goSpot(n);
  LEVELS[n].start();
}
$('#homeBtn').onclick=goHome;

/* ---------------- level 1: מה יש בפרח שלי ---------------- */
LEVELS[1]={goal:L1CATS.length,start(){this.order=L1CATS.slice();this.i=0;this.step()}, /* סדר קבוע, קל וללא סיכון — כולו היכרות עם עצמי */
step(){const cat=this.order[this.i];
  openPanel(`<div class="qTitle">${cat.q}</div><div class="sub">אין תשובה לא נכונה — הכל עליך אמיתי! 💛</div>
    <div class="optGrid">${cat.opts.map((o,j)=>`<button class="optCard" data-j="${j}"><span class="big">${o[0]}</span>${o[1]}</button>`).join('')}</div>`);
  document.querySelectorAll('#stage .optCard').forEach(b=>b.onclick=()=>{
    const o=cat.opts[+b.dataset.j];b.classList.add('picked');sndTap();
    const r=b.getBoundingClientRect();sparklesAt(r.left+r.width/2,r.top,4);
    addBank(cat.k,o[0],o[1]);
    document.querySelectorAll('#stage .optCard').forEach(x=>x.onclick=null);
    this.i++;setTimeout(()=>success(()=>this.step()),350);
  });
}};

/* ---------------- level 2: משפט שיתוף (הדרגתי: קל בהתחלה, אישי יותר בהמשך) ---------------- */
LEVELS[2]={goal:STARTERS.length,start(){this.used=[];this.step()},
step(){
  const cap=Math.min(PROG+1,STARTERS.length);
  const pool=STARTERS.slice(0,cap).filter((s,j)=>!this.used.includes(j)).map((s,j)=>({s,j:STARTERS.indexOf(s)}));
  if(pool.length===1){this.pickTile(pool[0].s,pool[0].j);return} /* אין באמת בחירה — ממשיכים ישר */
  const shown=shuffle(pool);
  openPanel(`<div class="qTitle">בחר התחלה למשפט שלך 💬</div>
    <div class="optGrid">${shown.map((p,j)=>`<button class="optCard" data-j="${j}"><span class="big">${p.s.e}</span>${p.s.t}</button>`).join('')}</div>`);
  document.querySelectorAll('#stage .optCard').forEach(b=>b.onclick=()=>{sndTap();const p=shown[+b.dataset.j];this.pickTile(p.s,p.j)});
},
pickTile(starter,idx){
  this.used.push(idx);
  const tiles=shuffle(starter.opts).slice(0,5);
  openPanel(`<div class="qTitle">${starter.t} — מה נוסיף? 🧩</div>
    <div class="optGrid">${tiles.map((t,j)=>`<button class="optCard" data-j="${j}"><span class="big">${t[0]}</span>${t[1]}</button>`).join('')}</div>`);
  document.querySelectorAll('#stage .optCard').forEach(b=>b.onclick=()=>{sndTap();this.saySentence(starter,tiles[+b.dataset.j])});
},
saySentence(starter,tile){
  const sen=starter.make(tile[1]);
  openPanel(`<div class="sentence">${tile[0]} ${sen}</div>
    <div class="sayLoud">עכשיו אמור את זה בקול! 🎤</div>
    <button class="btn grn" id="saidBtn">אמרתי בקול! ✅</button>`);
  $('#saidBtn').onclick=()=>{sndWin();$('#saidBtn').onclick=null;setTimeout(()=>success(()=>this.step()),300)};
}};

for(let n=1;n<=2;n++){LEVELS[n].icon=LVMETA[n].icon;LEVELS[n].name=LVMETA[n].name}

/* ================= הפנס הפנימי — real 3D dimming + pointer-follow torch ================= */
let heartSprite=null,heartPos=null,stopBeat=null;
function torchGate(cb){
  const need=!sessionTorch||Math.random()<.12;
  if(!need||!window.FLOWER3D){cb();return}
  sessionTorch=true;
  const F=window.FLOWER3D,T=F.THREE;
  const pp=(F.player&&F.player.g.position)||new T.Vector3(0,0,10);
  heartPos=new T.Vector3(pp.x,1.4,pp.z);
  if(!heartSprite){heartSprite=F.emojiSprite('💗',1.4);F.scene.add(heartSprite)}
  heartSprite.position.copy(heartPos);heartSprite.material.opacity=.22;heartSprite.scale.set(1.4,1.4,1);
  F.setNight(1);F.camSpot(new T.Vector3(pp.x+1.6,1.9,pp.z+3.4),new T.Vector3(pp.x,1.4,pp.z));
  F.torchLight.intensity=0;
  $('#torchCard').innerHTML=`<h2 style="margin:0">רגע — נקשיב ללב 💛</h2>
    <div class="sub">הזיזו את האצבע על המסך — הפנס יאיר את הדרך ללב 🔦</div>
    <div class="chargeRing" style="width:110px;height:110px;border-radius:50%;background:conic-gradient(#ffd54a calc(var(--p,0)*1%),rgba(255,255,255,.15) 0)" id="chargeRing"></div>`;
  showOv('ov-torch');
  let p=0,raf=null,done=false;const ring=$('#chargeRing');
  stopBeat=heartbeatStart();
  function onMove(ev){
    if(done)return;
    const t=ev.touches?ev.touches[0]:ev;const nx=(t.clientX/innerWidth)*2-1,ny=-(t.clientY/innerHeight)*2+1;
    const ray=new T.Raycaster();ray.setFromCamera({x:nx,y:ny},F.cam);
    const dist=F.cam.position.distanceTo(heartPos);
    const pt=ray.ray.at(dist,new T.Vector3());
    F.torchLight.position.set(pt.x,pt.y+.3,pt.z);
    const d=pt.distanceTo(heartPos);
    const near=d<1.5;
    F.torchLight.intensity=near?9:3.5;
    heartSprite.material.opacity=Math.min(1,.22+(near?.55:0));
    if(near){p=Math.min(100,p+1.6);if(((p/6)|0)%1===0)tone(300+p*4,.06,'sine',0,.06)}
    ring.style.setProperty('--p',p);
    if(p>=100&&!done){done=true;askHeart()}
  }
  ['pointermove','pointerdown','touchmove'].forEach(ev=>document.addEventListener(ev,onMove,{passive:true}));
  function cleanupMove(){['pointermove','pointerdown','touchmove'].forEach(ev=>document.removeEventListener(ev,onMove))}
  function askHeart(){
    cleanupMove();sndWarm();F.torchLight.intensity=6;heartSprite.material.opacity=1;
    $('#torchCard').innerHTML=`<h2 style="margin:0">לב שלי, מה אתה מרגיש?</h2>
      <div class="optGrid">${FEELS.map((f,i)=>`<button class="optCard" data-i="${i}"><span class="big">${f[0]}</span>${f[1]}</button>`).join('')}</div>`;
    $('#torchCard').querySelectorAll('.optCard').forEach(b=>b.onclick=()=>{sndTap();hugHeart(FEELS[+b.dataset.i])});
  }
  function hugHeart(f){
    if(stopBeat){stopBeat();stopBeat=null}
    $('#torchCard').innerHTML=`<h2 style="margin:0">עכשיו — לחבק את הלב</h2>
      <div class="sub">חיבוק גדול ללב שמרגיש ${f[1]} ${f[0]}</div>
      <button class="btn grn" id="hugBtn">🫂 לחבק את הלב</button>`;
    $('#hugBtn').onclick=()=>{
      sndWarm();const sc=F.worldToScreen(heartPos);sparklesAt(sc.x,sc.y,6);
      handOnHeart(f);
    };
  }
  function handOnHeart(f){
    $('#torchCard').innerHTML=`<h2 style="margin:0">מותק, מותר לך להרגיש ${f[1]} ${f[0]}</h2>
      <div class="sub">עכשיו אתה: שים יד על הלב שלך</div>
      <button class="btn grn" id="handBtn">🖐️💛 שמתי</button>`;
    $('#handBtn').onclick=()=>{sndTap();wordByWord(f)};
  }
  function wordByWord(f){
    const words=['מותר','לי','להרגיש','ככה','💛'];let lit=0;
    $('#torchCard').innerHTML=`<h2 style="margin:0">חזרו אחריי — מילה מילה</h2>
      <div class="wordRow" id="wRow">${words.map((w,i)=>`<button class="wBtn" data-i="${i}">${w}</button>`).join('')}</div>
      <button class="btn grn" id="wordDone" style="display:none">✅ סיימתי</button>`;
    $('#wRow').querySelectorAll('.wBtn').forEach(b=>b.onclick=()=>{
      if(+b.dataset.i!==lit)return; /* errorless: only the next word lights, tapping others does nothing */
      b.classList.add('lit');sndTap();lit++;
      if(lit>=words.length)$('#wordDone').style.display='block';
    });
    $('#wordDone').onclick=()=>{sndTap();finishTorch(cb)};
  }
  function finishTorch(cb){
    hideOv('ov-torch');padChord();
    F.setNight(0); /* warm light blooms back over the whole meadow — brighter than before */
    F.torchLight.intensity=0;heartSprite.material.opacity=0;
    confettiBurst();
    setTimeout(cb,600);
  }
}

/* ================= garden — the child's flowers, standing in the meadow ================= */
let gardenFlowers=[],gardenPanTimer=null;
function openGarden(){
  sndTap();hideAllOv();$('#backBtn').style.display='none';$('#homeBtn').style.display='block';
  $('#tbTitle').textContent='🌷 הגינה שלי';
  document.getElementById('gardenUI').style.display='block';
  const F=window.FLOWER3D;
  gardenFlowers.forEach(g=>F.scene.remove(g.grp));gardenFlowers=[];
  document.querySelectorAll('.gLabel').forEach(l=>l.remove());
  if(!S.garden.length){
    $('#gardenSub').textContent='הגינה עוד ריקה 🌱 כל פרח שנפתח עד הסוף — נשמר כאן לתמיד!';
    F.camSpot(new F.THREE.Vector3(-10,3,-10),new F.THREE.Vector3(-4,1,-20));
    return;
  }
  $('#gardenSub').textContent='כל פרח כאן הוא שיתופים אמיתיים שלך — אפשר להראות למורה ולמשפחה!';
  S.garden.forEach((f,i)=>{
    const grp=F.buildFlower3D(f.color);
    grp.position.set(-24+(i%6)*4.6,0,-22-Math.floor(i/6)*3.4);
    grp.scale.setScalar(1.1);F.scene.add(grp);
    grp.userData.petals.forEach(P=>{P.pivot.scale.set(1,1,1);P.open=true});
    const tp=TOPICS.find(t=>t.k===f.topic);
    const lab=document.createElement('div');lab.className='gLabel';
    lab.textContent=(f.date.slice(8,10)+'.'+f.date.slice(5,7))+(tp?' '+tp.e:'')+(f.bfly?' 🦋':'');
    document.body.appendChild(lab);
    gardenFlowers.push({grp,lab,pos:new F.THREE.Vector3(grp.position.x,1.7,grp.position.z)});
  });
  const cx=S.garden.reduce((s,_,i)=>s+(-24+(i%6)*4.6),0)/S.garden.length;
  const cz=S.garden.reduce((s,_,i)=>s-22-Math.floor(i/6)*3.4,0)/S.garden.length;
  F.camSpot(new F.THREE.Vector3(cx,4,cz+11),new F.THREE.Vector3(cx,1.4,cz));
  clearInterval(gardenPanTimer);let t=0;
  gardenPanTimer=setInterval(()=>{t+=.4;F.camSpot(new F.THREE.Vector3(cx+Math.sin(t*.3)*7,4,cz+11),new F.THREE.Vector3(cx+Math.sin(t*.3)*7,1.4,cz))},1200);
  (function labelLoop(){
    gardenFlowers.forEach(g=>{const sc=F.worldToScreen(g.pos);g.lab.style.left=sc.x+'px';g.lab.style.top=sc.y+'px';
      g.lab.style.display=(sc.x<-40||sc.x>innerWidth+40)?'none':'block'});
    if(document.getElementById('gardenUI').style.display!=='none')requestAnimationFrame(labelLoop);
  })();
}
function closeGarden(){
  clearInterval(gardenPanTimer);
  document.getElementById('gardenUI').style.display='none';
  document.querySelectorAll('.gLabel').forEach(l=>l.remove());
  goHome();
}

/* ================= 📸 save photo ================= */
function snapPhoto(){
  if(!window.FLOWER3D)return;sndTap();
  const data=window.FLOWER3D.snapPhotoNow();if(!data)return;
  const a=document.createElement('a');a.href=data;a.download='הפרח-שלי.png';a.click();
}

/* ================= teach-back: the owl "forgot" how to share ================= */
function teachBack(cb){
  if(S.teachbackDone){cb();return}
  S.teachbackDone=true;save();
  const F=window.FLOWER3D;
  say([
    {who:'🦉 הינשוף',t:'רגע רגע... אני קצת שכחתי איך משתפים משהו על עצמי! תעזור לי לזכור את הסדר הנכון? 🤔'}
  ],()=>{
    const steps=shuffle([
      {n:1,t:'לעצור ולהרגיש מה יש בלב 💗'},
      {n:2,t:'לבחור דבר קטן ואמיתי לספר 🌸'},
      {n:3,t:'לספר אותו בקול רגוע 🗣️'}
    ]);
    let next=1;
    function render(){
      openPanel(`<div class="qTitle">עזרו לינשוף — באיזה סדר משתפים? 🌸</div>
        <div class="optGrid one">${steps.map((s,j)=>`<button class="optCard" data-n="${s.n}" data-j="${j}">${s.t}</button>`).join('')}</div>`);
      document.querySelectorAll('#stage .optCard').forEach(b=>b.onclick=()=>{
        if(+b.dataset.n!==next){sndSoft();b.animate([{transform:'translateX(0)'},{transform:'translateX(5px)'},{transform:'translateX(-5px)'},{transform:'translateX(0)'}],{duration:250});return}
        sndTap();b.classList.add('picked');b.onclick=null;next++;
        if(next>3)setTimeout(owlPerforms,450);
      });
    }
    render();
    function owlPerforms(){
      closePanel();
      say([{who:'🦉 הינשוף',t:'עכשיו אני זוכר! 💛 עוצר ומרגיש... בוחר דבר קטן ואמיתי... ומספר בקול רגוע: "אני אוהב לעוף בין הענפים בשקיעה!"'}],()=>{
        if(F){const ofp=F.owl.position;const owlFlower=F.buildFlower3D('#ffb46b');
          owlFlower.position.set(ofp.x+1,0,ofp.z);owlFlower.scale.setScalar(.8);F.scene.add(owlFlower);
          let i=0;(function op(){F.openPetal3D(owlFlower,i,()=>{i++;if(i<8)op();else{confettiBurst();setTimeout(cb,900)}})})();
        }else cb();
      });
    }
  });
}

/* ================= opening / closing ceremony ================= */
function openingCeremony(){
  const f=$('#whiteFade');f.style.opacity=1;
  setTimeout(()=>{sndChime3();requestAnimationFrame(()=>{f.style.opacity=0})},250);
}
$('#backBtn').addEventListener('click',ev=>{
  ev.preventDefault();sndTap();
  say([{who:'🦉 הינשוף',t:'כל הכבוד על השיתוף היום 💛 הפרח שלך ממתין כאן — נחזור אליו יחד בפעם הבאה!'}],()=>{
    location.href='world.html';
  });
},{capture:true});

/* ================= opening story: alone in the field on the class trip ================= */
function startStory(){
  /* whether to show this again is driven by real progress (S.levels[1].plays), not a separate
     flag — so a page refresh/close mid-story never permanently skips it */
  hideAllOv();$('#homeBtn').style.display='none';$('#backBtn').style.display='none';
  const F=window.FLOWER3D;
  if(F&&F.player){
    F.player.g.position.set(11,0,-9);F.player.g.rotation.y=Math.PI*.3;
    /* the rest of the class strolls in real walking pairs near the blanket (spawned already in the 3D boot) —
       the child is the only one alone */
  }
  /* establishing shot FIRST — guarantee every child actually sees the group together,
     since the camera would otherwise never naturally turn that way on its own */
  if(F){F.enterCine();F.camSpot(new F.THREE.Vector3(-2,4.6,4.5),new F.THREE.Vector3(-2,1.4,20))}
  setTimeout(()=>{
    if(F)F.enterExplore(); /* now a real moment alone among the flowers, free to walk and look around */
  },2200);
  setTimeout(()=>{
    if(F){F.enterCine();F.faceOwl();F.camSpot(new F.THREE.Vector3(25,5,3),new F.THREE.Vector3(13.5,1.2,-11))}
    say([
      {who:'🦉 הינשוף',t:'היי... רואה אותך פה לבד בשדה, בזמן שכולם ליד השמיכה 💛'},
      {who:'🦉 הינשוף',t:'תראה כמה פרחים יש כאן. כל אחד מהם היה פעם סגור לגמרי —'},
      {who:'🦉 הינשוף',t:'עד שהוא פתח את עצמו, עלה אחרי עלה.'},
      {who:'🦉 הינשוף',t:'כשמספרים לחבר משהו אמיתי על עצמנו — זה בדיוק ככה. בוא תנסה?'},
      {who:'🧒 אני',t:'אני... קצת מתבייש להגיד דברים על עצמי.'},
      {who:'🧒 אני',t:'אני מפחד שידחו אותי אם אני אשתף. 😳'},
      {who:'🦉 הינשוף',t:'זה לגמרי בסדר להרגיש ככה. לכל אחד קשה לפעמים.'},
      {who:'🦉 הינשוף',t:'יש לי כלי בדיוק בשביל רגעים כאלה — הפנס הפנימי 🔦'}
    ],askOvercome);
  },6400);
}
function askOvercome(){
  const F=window.FLOWER3D;
  openPanel(`<div style="font-size:50px">🔦💛</div>
    <h2 style="margin:4px 0">רוצה שננסה יחד, ונראה אם תרגיש מוכן להתגבר על זה?</h2>
    <button class="btn grn" id="tryBtn" style="font-size:19px">כן, בוא ננסה 💪</button>`);
  $('#tryBtn').onclick=()=>{sndTap();closePanel();torchGate(()=>startLevel(1))};
}

/* boot: wait for the 3D world to finish loading its assets */
function bootUI(){
  applyFlowerColor(S.profile.color||'#ff9ec4');
  openingCeremony();
  if(!S.profile.color||!S.profile.topic)setup();
  else if(S.levels[1].plays===0)startStory();
  else goHome();
}
if(window.FLOWER3D)bootUI();else window.addEventListener('flowerReady',bootUI,{once:true});
</script>
